services:
  # -------------------------------------------------------------
  # Application Service: Hardened Node.js Express Server
  # -------------------------------------------------------------
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.secure
    image: demo:secure
    container_name: production-api-secure
    ports:
      - "3000:3000"
    restart: always

    # --- Kernel Isolation & Cgroups Bounds ---
    deploy:
      resources:
        limits:
          cpus: '0.50'         # Restrict process capacity to 50% of a single CPU core
          memory: 256M         # Thwart memory depletion DoS vectors
          pids: 50             # Imposes process ceiling to block Fork Bombs

    # --- Runtime Security Privileges ---
    read_only: true            # Prevents arbitrary script injection on disk filesystem
    tmpfs:
      - /tmp:uid=10001,gid=10001 # Ephemeral memory pool for runtime temp needs
    cap_drop:
      - ALL                    # Strips all elevated Linux kernel privileges
    security_opt:
      - no-new-privileges:true # Blocks escalating runtime capabilities post-execution

  # -------------------------------------------------------------
  # Registry Service: Internal Private OCI Registry
  # -------------------------------------------------------------
  private-registry:
    image: registry:2
    container_name: corporate-private-registry
    ports:
      - "5001:5000"
    restart: always
    environment:
      REGISTRY_STORAGE_DELETE_ENABLED: "true"