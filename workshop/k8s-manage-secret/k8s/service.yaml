# =============================================================
# Service: stable internal endpoint for the demo API Pods.
# =============================================================
apiVersion: v1
kind: Service
metadata:
  name: vault-demo-app
  labels:
    app: vault-demo-app
    tier: backend
spec:
  type: ClusterIP
  selector:
    app: vault-demo-app
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: http
