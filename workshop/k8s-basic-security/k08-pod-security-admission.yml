# =============================================================================
# K08 - Broken Authentication / Lack of Admission Control
# Pod Security Admission (PSA) - built-in admission controller (GA since v1.25)
# Enforces the "restricted" Pod Security Standard at the namespace level.
# =============================================================================

# -----------------------------------------------------------------------------
# Option A: Apply PSA labels to a dedicated, hardened namespace.
#   - enforce: REJECTS pods that violate the policy (hard gate)
#   - audit:   records violations in the audit log
#   - warn:    returns a warning to the user on kubectl apply
# The "restricted" level requires exactly the controls set in better.yml:
#   runAsNonRoot, drop ALL capabilities, seccompProfile, no privilege escalation,
#   no privileged containers, no hostPath/hostNetwork, etc.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: secure-apps
  labels:
    # Enforce the strictest standard and pin to a known version
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    # Audit + warn give visibility without breaking less-strict workloads
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# -----------------------------------------------------------------------------
# Option B: Add the same enforcement to the existing default namespace.
#   Apply with:  kubectl label --overwrite ns default \
#                  pod-security.kubernetes.io/enforce=restricted
#   The manifest below is the declarative equivalent.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: default
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
